name: Post to Instagram

on:
  # 01:00 and 02:00 UTC: one of them is 20:00 in Guardian's time zone (America/Chicago),
  # whether or not daylight saving is on. post.mjs posts once a day, from 20:00.
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      post_date:
        description: 'Post this day now (YYYY-MM-DD). Empty = today, only from 20:00.'
        required: false

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish today's post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          POST_DATE: ${{ inputs.post_date }}
        run: node post.mjs
      - name: Record it
        run: |
          git add posted
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "guardian-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Posted $(ls -t posted | head -1 | sed 's/.json//')"
          git push
