name: Post to Instagram

on:
  # Hourly, off the top of the hour (GitHub delays scheduled runs, most at :00). post.mjs decides:
  # today's post at 20:00 Guardian time (America/Chicago; an afternoon run waits for it), or yesterday's if a late run missed it.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      post_date:
        description: 'Post this day now (YYYY-MM-DD). Empty = today, only from 20:00.'
        required: false

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    # post.mjs may wait up to 340 minutes for 20:00 when a run lands in the afternoon.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish today's post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          POST_DATE: ${{ inputs.post_date }}
        run: node post.mjs
      - name: Record it
        run: |
          git add posted
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "guardian-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Posted $(ls -t posted | head -1 | sed 's/.json//')"
          git pull --rebase -q
          git push
